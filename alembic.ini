# Alembic configuration for the `tether` schema (PD-4).
#
# Normally migrations run through `tether migrate` (the one-shot `migrate` container), which
# does not need this file. It exists so the `alembic` CLI can be used during development, e.g.
#   uv run alembic revision -m "describe the change"
# The database URL is read from TETHER_MIGRATOR_DATABASE_URL by the migration environment.

[alembic]
script_location = tether.storage:migrations
file_template = rev_%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

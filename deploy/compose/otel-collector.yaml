# OpenTelemetry collector (architecture §19): receives OTLP from api and worker, forwards traces
# to Jaeger, and prints metrics to its own log (V1 has no Prometheus/Grafana, AD-13):
#   docker compose -f deploy/compose/docker-compose.yml logs otel-collector
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/metrics]

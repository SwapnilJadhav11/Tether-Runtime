[project]
name = "tether-runtime"
version = "0.0.0"
description = "Tether: a self-hostable, model-agnostic governed tool-execution runtime."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    # Exact pins (PD-22): bump only with the S1.3 LangGraph contract suite green.
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.2",
    # The first hosted model provider (TDR-004). Imported only by providers/openai_provider.py;
    # the SDK sits on `httpx2`, and its automatic retries are switched off there.
    "openai>=3.51.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-sdk>=1.29",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "rfc8785==0.1.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "typer>=0.15",
    "uvicorn>=0.32",
]

# One image, several entrypoints (ADR-0001): `tether-api` and `tether-worker` are the two
# long-running processes; `tether` is the CLI (including `tether migrate` for the migrate service).
[project.scripts]
tether = "tether.cli.main:app"
tether-api = "tether.api.app:run"
tether-worker = "tether.worker.main:main"
tether-worker-healthcheck = "tether.worker.main:healthcheck"

# Workloads register with Tether through this entry-point group and are discovered by name from
# bootstrap configuration (ADR-0002).
[project.entry-points."tether.workloads"]
incident_remediation = "workloads.incident_remediation:WORKLOAD"
change_control = "workloads.change_control:WORKLOAD"

[dependency-groups]
dev = [
    "httpx>=0.28",
    # The OpenAI SDK's transport: the provider tests mock it, so they import it directly.
    "httpx2>=2.13",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.13",
    "poethepoet>=0.31",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
# Live model-provider tests (PRD T-11) need nothing beyond the runtime dependencies: the OpenAI
# SDK ships with the package.
live = []

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The reference workload ships in the same wheel so the worker can discover it by entry point.
packages = ["src/tether", "workloads"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "workloads", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PTH",     # prefer pathlib
    "PT",      # pytest style
    "S",       # bandit (security)
    "T20",     # no print
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest tests assert

# --------------------------------------------------------------------------------------------
# mypy: strict on every Python source root that ships or registers code
# --------------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "workloads"]
# Understands pydantic models and BaseSettings (fields populated from the environment).
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
# Repository root: tests import the reference workload and the demo services directly.
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires real model providers (manual dispatch only)",
    "chaos: process-kill reliability tests",
    "perf: performance and load tests",
]

# --------------------------------------------------------------------------------------------
# import-linter: the workload boundary (ADR-0002, PRD T-14)
# --------------------------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["tether", "workloads"]

[[tool.importlinter.contracts]]
name = "Tether core must not import workloads (ADR-0002, T-14)"
type = "forbidden"
source_modules = ["tether"]
forbidden_modules = ["workloads"]

[[tool.importlinter.contracts]]
name = "Workloads may import only tether.sdk from Tether (ADR-0002, T-14)"
type = "forbidden"
source_modules = ["workloads"]
# Every top-level core module except tether.sdk. tests/architecture enforces that this list
# stays complete as core modules are added.
forbidden_modules = [
    "tether.api",
    "tether.approvals",
    "tether.audit",
    "tether.authz",
    "tether.cli",
    "tether.core",
    "tether.identity",
    "tether.ledger",
    "tether.observability",
    "tether.policy",
    "tether.providers",
    "tether.queue",
    "tether.reconciliation",
    "tether.registry",
    "tether.runtime",
    "tether.secrets",
    "tether.settings",
    "tether.storage",
    "tether.testing",
    "tether.worker",
]

# --------------------------------------------------------------------------------------------
# Poe tasks (cross-platform: no shell syntax; run with `uv run poe <task>`)
# --------------------------------------------------------------------------------------------

[tool.poe.tasks.lint]
help = "Ruff lint and format check"
sequence = ["ruff check .", "ruff format --check ."]
default_item_type = "cmd"

[tool.poe.tasks.format]
help = "Apply Ruff formatting and safe lint fixes"
sequence = ["ruff format .", "ruff check --fix ."]
default_item_type = "cmd"

[tool.poe.tasks.typecheck]
help = "Strict mypy over src/ and workloads/"
cmd = "mypy"

[tool.poe.tasks.contracts]
help = "Import-linter contracts plus architecture tests (T-14, package layout)"
sequence = ["lint-imports", "pytest tests/architecture"]
default_item_type = "cmd"
# import-linter prints non-ASCII; UTF-8 mode keeps it working on Windows (cp1252) consoles.
env = { PYTHONUTF8 = "1" }

[tool.poe.tasks.test-unit]
help = "Unit tests"
cmd = "pytest tests/unit"

[tool.poe.tasks.test-integration]
help = "Integration tests against deploy/compose/docker-compose.test.yml (needs Docker and deploy/compose/.env)"
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "pytest tests/integration",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.test-provider-contract]
help = "Provider contract suite on the scripted provider and the OpenAI adapter (no network, no database)"
cmd = "pytest tests/contract/providers -m 'not live'"

[tool.poe.tasks.test-live]
help = "Live provider proof against the real OpenAI API (T-11), including one governed run end to end. Needs TETHER_MODEL_PROVIDER=openai, TETHER_OPENAI_API_KEY and TETHER_OPENAI_MODEL; skips without them. Paid calls: never run in ordinary CI."
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "pytest tests/contract/providers tests/integration/test_live_openai_governed_run.py -m live",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.test-contract]
help = "LangGraph semantics contract suite on the pinned versions (required on every LangGraph bump)"
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "pytest tests/contract/langgraph",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.test-chaos]
help = "Chaos and race suite (crash injection, competing workers, 50x races, real process kills)"
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "pytest tests/chaos -m chaos",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.test-flake-gate]
help = "Flake gate: run the chaos suite N times (default 20; arguments go to scripts/flake_gate.py). The caller holds the shared database lock"
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "python scripts/flake_gate.py",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.test-authz]
help = "T-24 authorization matrix with a second fixture workspace, route inventory, ops run view and access events"
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "pytest tests/authz",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.test-perf]
help = "Load and kill harness (several in-process workers; parameters via TETHER_PERF_* variables)"
sequence = [
    "docker compose -f deploy/compose/docker-compose.test.yml up -d --wait",
    "pytest tests/perf -m perf -s",
]
default_item_type = "cmd"
envfile = "deploy/compose/.env"

[tool.poe.tasks.smoke]
help = "Build and start the full compose stack, wait until every service is healthy, then list them"
sequence = [
    "docker compose -f deploy/compose/docker-compose.yml up -d --build --wait",
    "docker compose -f deploy/compose/docker-compose.yml ps",
]
default_item_type = "cmd"

[tool.poe.tasks.ci]
help = "Static checks run by CI: lint, typecheck, contracts, unit and provider-contract tests"
sequence = ["lint", "typecheck", "contracts", "test-unit", "test-provider-contract"]
